<!doctype html><html lang="en" dir="ltr"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>RADE OFFICE — V2</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' fill='%230b0913'/><rect x='3' y='4' width='10' height='7' fill='%23b57bff'/></svg>">
<style>
@font-face{font-family:"BoldPixels";src:url("font/boldpixels.woff2") format("woff2"),url("font/boldpixels.woff") format("woff");font-display:swap}
:root{
  --bg:#0a0810; --panel:#15111f; --panel2:#1c1629; --line:#2f2646; --line2:#3d3358;
  --ink:#ece5f7; --dim:#8f82ab; --violet:#b57bff; --amber:#ffb020;
  --ok:#5ef08a; --err:#ff5f6b; --idle:#7cc4ff; --cyan:#5ecbff;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--ink);overflow:hidden;
  font-family:"BoldPixels",ui-monospace,Menlo,Consolas,monospace}
body{display:grid;grid-template-columns:1fr 306px;grid-template-rows:1fr 226px;gap:9px;padding:9px}
.card{background:var(--panel);border:2px solid var(--line);border-radius:7px}
.hd{display:flex;align-items:center;gap:8px;padding:10px 13px;font-size:14px;letter-spacing:1.6px;
  border-bottom:2px solid var(--line)}
.hd .sp{margin-left:auto;color:var(--dim);font-size:11px;letter-spacing:1px}
.chev{color:var(--dim);font-size:11px}

/* ---------------- room ---------------- */
#stage{grid-row:1;grid-column:1;position:relative;overflow:hidden;background:#0b0913;padding:0}
#room{position:absolute;left:0;top:0;image-rendering:pixelated}
#tags{position:absolute;left:0;top:0;pointer-events:none}
.plate{position:absolute;transform:translate(-50%,-100%);white-space:nowrap;
  background:rgba(22,16,34,.94);border:2px solid var(--line2);border-radius:5px;
  padding:5px 10px 6px;font-size:13px;line-height:1.4;box-shadow:0 4px 0 rgba(0,0,0,.45)}
.plate b{color:var(--violet);margin-right:7px}
.plate i{font-style:normal;display:block;font-size:11px;letter-spacing:1.4px}
.st-running{color:var(--ok)} .st-idle{color:var(--idle)}
.st-error{color:var(--err)} .st-off{color:var(--amber)}
#clock{position:absolute;transform:translate(-50%,-50%);background:#08070e;
  border:2px solid #3f3757;border-radius:4px;padding:5px 10px 6px;text-align:center;line-height:1.15}
#clock .lb{display:block;font-size:9px;color:#7b6ca0;letter-spacing:2px}
#clock .hh{display:block;font-size:19px;color:#d9c6ff}
#clock .dd{display:block;font-size:9px;color:#8b7cb2;letter-spacing:1.5px}

/* ---------------- sidebar ---------------- */
#side{grid-row:1;grid-column:2;display:flex;flex-direction:column;gap:9px;min-height:0}
#side .card{display:flex;flex-direction:column;min-height:0}
.mets{padding:9px}
.met{display:flex;align-items:center;gap:10px;border:2px solid var(--line);border-radius:6px;
  padding:8px 10px;margin-bottom:8px;background:var(--panel2);position:relative}
.met:last-child{margin-bottom:0}
.ico{width:28px;height:28px;flex:none;border:2px solid var(--line2);border-radius:4px;
  display:grid;place-items:center;font-size:13px;color:var(--cyan)}
.met .nm{font-size:13px;letter-spacing:1.4px}
.met .vl{margin-left:auto;font-size:15px;text-align:right}
.met .vl small{display:block;font-size:9px;color:var(--dim);letter-spacing:1px}
.met canvas{position:absolute;right:10px;bottom:5px;width:120px;height:13px}
.brow{display:flex;align-items:center;gap:9px;padding:8px 13px;font-size:13px;
  border-bottom:1px solid #241d38}
.brow:last-child{border-bottom:0}
.brow .n{color:var(--violet);width:13px}
.brow .who{flex:1}
.brow .stt{font-size:11px;letter-spacing:1.3px}
.dot{width:8px;height:8px;border-radius:50%;background:currentColor;box-shadow:0 0 8px currentColor}
#apibox{display:flex;align-items:center;gap:11px;padding:13px}
#apibox .txt{font-size:14px;letter-spacing:1.2px}
#apibox .sub{font-size:10px;color:var(--dim);letter-spacing:1px}
#wifi{margin-left:auto;font-size:17px}

/* ---------------- logs ---------------- */
#logs{grid-row:2;grid-column:1;display:flex;flex-direction:column;min-height:0}
#loglist{flex:1;overflow:auto;padding:8px 14px;font-size:13px;line-height:1.85}
#loglist div{display:flex;gap:12px;white-space:pre-wrap}
#loglist .t{color:#5f5480;flex:none} #loglist .w{width:118px;flex:none}
.lv-ok{color:var(--ok)} .lv-err{color:var(--err)} .lv-warn{color:var(--amber)} .lv-info{color:#a9c6e8}
.hd .ctl{display:flex;gap:9px;margin-left:auto}
.hd .ctl b{cursor:pointer;color:var(--dim);font-weight:normal;font-size:14px}
.hd .ctl b:hover{color:var(--ink)}
.hd .ctl b.on{color:var(--amber)}

/* ---------------- actions ---------------- */
#acts{grid-row:2;grid-column:2;display:flex;flex-direction:column}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;padding:11px}
button.act{font:inherit;font-size:11px;letter-spacing:1.2px;color:var(--ink);cursor:pointer;
  border:2px solid;border-radius:6px;padding:11px 4px;display:flex;flex-direction:column;
  align-items:center;gap:7px;line-height:1.25;text-align:center}
button.act .big{font-size:20px}
.a-blue{border-color:#2b5f8a;background:#132437} .a-blue .big{color:var(--cyan)}
.a-violet{border-color:#5a3b86;background:#221836} .a-violet .big{color:var(--violet)}
.a-amber{border-color:#8a6a20;background:#3a2c10} .a-amber .big{color:var(--amber)}
.a-green{border-color:#2f7a45;background:#12301d} .a-green .big{color:var(--ok)}
button.act:hover{filter:brightness(1.35)}
.made{margin-top:auto;padding:0 13px 9px;font-size:10px;color:#5b5080;text-align:right;letter-spacing:1.4px}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:9;
  background:#1d1730;border:2px solid var(--violet);border-radius:5px;padding:10px 18px;
  font-size:13px;display:none}
#toast.bad{border-color:var(--err);color:#ffb8bd}
@media (max-width:1100px){
  body{grid-template-columns:1fr;grid-template-rows:auto auto auto auto;overflow:auto;height:auto}
  #stage{grid-row:1;height:54vh} #side{grid-row:2;flex-direction:row;flex-wrap:wrap}
  #side .card{flex:1 1 250px} #logs{grid-row:3;height:210px} #acts{grid-row:4}
}
</style></head><body>

<div id="stage" class="card">
  <canvas id="room"></canvas>
  <div id="tags"><div id="clock"><span class="lb">TIME</span><span class="hh">--:--:--</span><span class="dd">---</span></div></div>
</div>

<div id="side">
  <div class="card">
    <div class="hd">SYSTEM STATUS <span class="chev sp">⌄</span></div>
    <div class="mets" id="sys"></div>
  </div>
  <div class="card" style="flex:1">
    <div class="hd">BOTS STATUS <span class="sp" id="count"></span></div>
    <div id="bots" style="overflow:auto;min-height:0"></div>
  </div>
  <div class="card">
    <div class="hd">API CONNECTION <span class="chev sp">⌄</span></div>
    <div id="apibox">
      <span class="ico" id="apiic">◍</span>
      <span><span class="txt" id="apitxt">…</span><br><span class="sub" id="apisub">checking</span></span>
      <span id="wifi">≋</span>
    </div>
  </div>
</div>

<div id="logs" class="card">
  <div class="hd">LIVE LOGS
    <span class="ctl">
      <b id="pause" title="pause">❚❚</b><b id="clear" title="clear">🗑</b><span class="chev" id="logn"></span>
    </span>
  </div>
  <div id="loglist"></div>
</div>

<div id="acts" class="card">
  <div class="hd">QUICK ACTIONS</div>
  <div class="grid">
    <button class="act a-blue" data-do="restart-all"><span class="big">⟳</span>RESTART<br>ALL</button>
    <button class="act a-violet" data-do="clear-logs"><span class="big">🗑</span>CLEAR<br>LOGS</button>
    <button class="act a-amber" data-do="full"><span class="big">⛶</span>FULL<br>SCREEN</button>
    <button class="act a-green" data-do="refresh"><span class="big">↻</span>REFRESH<br>DATA</button>
  </div>
  <div class="made">MADE WITH ♥ BY RADE</div>
</div>

<div id="toast"></div>

<script>
const $ = id => document.getElementById(id);
const stage = $("stage"), cv = $("room"), cx = cv.getContext("2d"), tags = $("tags");

/* ---------------- art ---------------- */
const IMG = {};
function load(key, src){ const i = new Image(); i.onload = () => { IMG[key] = i; }; i.src = src; }
let MAN = null, SCALE = 1;
const POSES = ["type_a", "type_a2", "type_b", "error", "cheer", "sleep"];
// a slot that owns its furniture: the sprite carries the desk, so nothing is
// baked under it and no monitor is drawn in front
const own = i => !!(MAN && MAN.own && MAN.own.indexOf(i) >= 0);

fetch("office/room.json", {cache:"no-store"}).then(r => r.json()).then(m => {
  MAN = m;
  load("room", "office/room.png");
  for (let b = 1; b <= 6; b++) {
    POSES.forEach(p => load("b" + b + "_" + p, "office/spr/bot" + b + "_" + p + ".png"));
    for (let i = 0; i < 4; i++) load("b" + b + "_walk" + i, "office/spr/bot" + b + "_walk" + i + ".png");
  }
  for (let i = 0; i < 4; i++) load("walk" + i, "office/spr/walk_" + i + ".png");
  load("station", "office/spr/station.png");
  fit(); requestAnimationFrame(frame);
});

function fit(){
  if (!MAN) return;
  const [w, h] = MAN.world;
  // cover, not contain: the reference has no letterboxing round the room
  SCALE = Math.max(stage.clientWidth / w, stage.clientHeight / h);
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  cv.width = Math.round(w * SCALE * dpr); cv.height = Math.round(h * SCALE * dpr);
  cv.style.width = (w * SCALE) + "px"; cv.style.height = (h * SCALE) + "px";
  const ox = Math.round((stage.clientWidth - w * SCALE) / 2);
  const oy = Math.round((stage.clientHeight - h * SCALE) / 2);
  for (const el of [cv, tags]) { el.style.left = ox + "px"; el.style.top = oy + "px"; }
  tags.style.width = (w * SCALE) + "px"; tags.style.height = (h * SCALE) + "px";
  cx.setTransform(SCALE * dpr, 0, 0, SCALE * dpr, 0, 0);
  cx.imageSmoothingEnabled = false;
  placeTags();
}
addEventListener("resize", fit);

/* ---------------- live data ---------------- */
let DATA = null, VIEW = false, lastLogN = 0, paused = false;
const SEEN = {}, CHEER = {}, HIST = {cpu: [], ram: []};
const STATE_TXT = {running:"RUNNING", idle:"IDLE", error:"ERROR", off:"OFF"};

async function poll(){
  try {
    const d = await (await fetch("api/status", {cache:"no-store"})).json();
    DATA = d; VIEW = !!d.view;
    HIST.cpu.push(d.machine.cpu); HIST.ram.push(d.machine.ram);
    for (const k in HIST) if (HIST[k].length > 60) HIST[k].shift();
    paintSide(d); if (!paused) paintLogs(d.logs || []); placeTags();
  } catch (e) { /* next tick tries again */ }
}
setInterval(poll, 2000); poll();

const esc = t => String(t).replace(/[<>&]/g, c => ({"<":"&lt;", ">":"&gt;", "&":"&amp;"}[c]));

function paintSide(d){
  const m = d.machine;
  const met = (ic, n, v, sub, id) => `<div class="met"><span class="ico">${ic}</span>
    <span class="nm">${n}</span><span class="vl">${v}${sub ? `<small>${sub}</small>` : ""}</span>
    ${id ? `<canvas id="${id}" width="240" height="26"></canvas>` : ""}</div>`;
  $("sys").innerHTML =
    met("▣", "CPU", m.cpu + "%", "", "spCpu") +
    met("▤", "RAM", m.ram + "%", m.ram_gb + " GB", "spRam") +
    met("▦", "DISK", m.disk + "%", m.disk_free_gb + " GB free") +
    met("⚑", "LOAD", m.load, m.cores + " cores") +
    met("◔", "UPTIME", m.uptime, "");
  spark($("spCpu"), HIST.cpu, "#5ef08a");
  spark($("spRam"), HIST.ram, "#5ecbff");

  $("bots").innerHTML = d.bots.map(b => `<div class="brow">
      <span class="n">${b.n}</span><span class="who">${esc(b.name)}</span>
      <span class="stt st-${b.state}">${STATE_TXT[b.state] || b.state}</span>
      <span class="dot st-${b.state}"></span></div>`).join("");
  $("count").textContent = d.bots.filter(b => b.state !== "off").length + "/" + d.bots.length;

  const ok = d.api && d.api.ok;
  $("apitxt").textContent = ok ? "CONNECTED" : "UNREACHABLE";
  $("apitxt").style.color = $("apiic").style.color = $("wifi").style.color =
    ok ? "var(--ok)" : "var(--err)";
  $("apisub").textContent = "anthropic api · " + (d.api ? d.api.code : "?");

  $("clock").querySelector(".hh").textContent = m.clock;
  $("clock").querySelector(".dd").textContent = m.date;

  d.bots.forEach(b => {
    if (SEEN[b.id] && SEEN[b.id] !== "running" && b.state === "running") CHEER[b.id] = performance.now();
    SEEN[b.id] = b.state;
  });
}

function spark(c, series, colour){
  if (!c || series.length < 2) return;
  const g = c.getContext("2d"), w = c.width, h = c.height;
  g.clearRect(0, 0, w, h);
  g.strokeStyle = colour; g.lineWidth = 2; g.beginPath();
  series.forEach((v, i) => {
    const x = i / (series.length - 1) * w, y = h - (Math.min(100, v) / 100) * (h - 3) - 1;
    i ? g.lineTo(x, y) : g.moveTo(x, y);
  });
  g.stroke();
}

function paintLogs(logs){
  const box = $("loglist");
  if (VIEW && !logs.length && !box.childElementCount)
    box.innerHTML = `<div class="lv-info">logs are behind the control token</div>`;
  const fresh = logs.filter(l => l.n > lastLogN);
  fresh.forEach(l => {
    lastLogN = Math.max(lastLogN, l.n);
    const d = document.createElement("div");
    d.innerHTML = `<span class="t">[${l.t}]</span><span class="w lv-${l.level}">${esc(l.who)}</span>` +
                  `<span class="lv-${l.level}">${esc(l.msg)}</span>`;
    box.appendChild(d);
  });
  while (box.childElementCount > 200) box.removeChild(box.firstChild);
  if (fresh.length) box.scrollTop = box.scrollHeight;
  $("logn").textContent = lastLogN ? "#" + lastLogN : "";
}

/* ---------------- plates ---------------- */
function placeTags(){
  if (!MAN || !DATA) return;
  DATA.bots.forEach((b, i) => {
    const d = MAN.desks[i]; if (!d) return;
    let el = document.getElementById("pl" + i);
    if (!el) { el = document.createElement("div"); el.id = "pl" + i; el.className = "plate"; tags.appendChild(el); }
    el.style.left = (d.x * SCALE) + "px";
    el.style.top = ((d.y - (own(i) ? 202 : 244)) * SCALE) + "px";
    el.innerHTML = `<b>${b.n}</b>${esc(b.name)}<i class="st-${b.state}">${STATE_TXT[b.state] || b.state}` +
                   `${b.ctx == null ? "" : " · CTX " + b.ctx + "%"}</i>`;
  });
  $("clock").style.left = (MAN.clock.x * SCALE) + "px";
  $("clock").style.top = (MAN.clock.y * SCALE) + "px";
}

/* ---------------- the room, animated ---------------- */
const COFFEE = {x: 726, y: 268};
let trip = null, nextTrip = 15000;

function pickTrip(now){
  const idle = DATA.bots.map((b, i) => i).filter(i => DATA.bots[i].state === "idle" && MAN.desks[i]);
  if (!idle.length) return;
  const i = idle[Math.floor(now / 997) % idle.length];
  trip = {i, t0: now, from: {x: MAN.desks[i].x, y: MAN.desks[i].y}};
}

function frame(now){
  requestAnimationFrame(frame);
  if (!MAN || !IMG.room) return;
  const [W, H] = MAN.world;
  cx.clearRect(0, 0, W, H);
  cx.drawImage(IMG.room, 0, 0);
  if (!DATA) return;
  if (!trip && now > nextTrip) { pickTrip(now); nextTrip = now + 50000; }

  const draw = [];
  DATA.bots.forEach((b, i) => {
    const d = MAN.desks[i]; if (!d) return;
    if (trip && trip.i === i) return;                 // out getting coffee
    const key = "b" + ((i % 6) + 1) + "_";
    const mine = own(i), lift = mine ? 0 : 84;
    const cheering = CHEER[b.id] && now - CHEER[b.id] < 2600;
    let sp = IMG[key + "type_b"], dx = 0, dy = 0, alpha = 1;
    if (cheering) sp = IMG[key + "cheer"] || IMG[key + "type_a"];
    else if (b.state === "error") { sp = IMG[key + "error"]; dx = Math.round(Math.sin(now / 55) * 3); }
    else if (b.state === "running") {
      // characters that have a second typing frame really animate their hands
      const alt = IMG[key + "type_a2"];
      sp = alt && Math.floor(now / 260) % 2 ? alt : IMG[key + "type_a"];
      dy = Math.floor(now / 170) % 2 ? -2 : 0;
    }
    else if (b.state === "off") { sp = IMG[key + "sleep"] || sp; alpha = .8; }
    if (!sp) return;
    draw.push({y: d.y, run: () => {
      cx.globalAlpha = alpha;
      cx.drawImage(sp, Math.round(d.x - sp.width / 2 + dx), Math.round(d.y - lift - sp.height + dy));
      cx.globalAlpha = 1;
      const st = IMG.station;
      if (st && !mine) cx.drawImage(st, Math.round(d.x + 4 - st.width / 2), Math.round(d.y - 44 - st.height));
      if (b.state === "running" && !mine) glow(d.x - 12, d.y - 100, now);
      if (b.state === "off" || b.state === "idle")
        zzz(d.x + 62, d.y - lift - sp.height + 16, now, b.state === "off");
    }});
  });
  if (trip) walker(now, draw);
  draw.sort((a, b) => a.y - b.y).forEach(o => o.run());
}

function glow(x, y, now){
  cx.globalAlpha = .16 + .1 * Math.sin(now / 220);
  cx.fillStyle = "#b57bff";
  cx.fillRect(Math.round(x - 26), Math.round(y - 18), 52, 34);
  cx.globalAlpha = 1;
}

function zzz(x, y, now, loud){
  const t = (now / 1400) % 1;
  cx.globalAlpha = (loud ? .9 : .4) * (1 - t);
  cx.fillStyle = "#cbb6ff";
  cx.font = "18px BoldPixels, monospace";
  cx.fillText("z", Math.round(x), Math.round(y - t * 26));
  cx.fillText("Z", Math.round(x + 13), Math.round(y - 12 - t * 30));
  cx.globalAlpha = 1;
}

function walker(now, draw){
  const LEG = 7000, PAUSE = 4500;
  const e = now - trip.t0;
  let p, back = false;
  if (e < LEG) p = e / LEG;
  else if (e < LEG + PAUSE) p = 1;
  else if (e < LEG * 2 + PAUSE) { p = 1 - (e - LEG - PAUSE) / LEG; back = true; }
  else { trip = null; return; }
  const x = trip.from.x + (COFFEE.x - trip.from.x) * p;
  const y = trip.from.y + (COFFEE.y - trip.from.y) * p;
  const moving = p > 0 && p < 1;
  const k = moving ? ((back ? 2 : 0) + (Math.floor(now / 200) % 2)) : 1;
  const key = "b" + ((trip.i % 6) + 1) + "_walk";      // the bot walks as itself
  const sp = IMG[key + k] || IMG["walk" + k];
  if (!sp) return;
  draw.push({y, run: () => cx.drawImage(sp, Math.round(x - sp.width / 2), Math.round(y - sp.height))});
}

/* ---------------- controls ---------------- */
let toastT;
function toast(msg, bad){
  const el = $("toast"); el.textContent = msg;
  el.className = bad ? "bad" : ""; el.style.display = "block";
  clearTimeout(toastT); toastT = setTimeout(() => { el.style.display = "none"; }, 4500);
}
async function post(path){
  try {
    const j = await (await fetch(path, {method:"POST", headers:{"Content-Type":"application/json"},
                                       body:"{}"})).json();
    toast(j.msg, !j.ok); setTimeout(poll, 1200);
  } catch (e) { toast("error: " + e.message, true); }
}
$("pause").onclick = ev => { paused = !paused; ev.target.classList.toggle("on", paused);
                             toast(paused ? "logs paused" : "logs live"); };
$("clear").onclick = () => { $("loglist").innerHTML = ""; lastLogN = 0;
                             if (!VIEW) post("api/clear-logs"); };
document.addEventListener("click", ev => {
  const btn = ev.target.closest("button[data-do]"); if (!btn) return;
  const d = btn.dataset.do;
  if (d === "refresh") { poll(); toast("refreshed"); return; }
  if (d === "full") { document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen(); return; }
  if (VIEW) { toast("open with the control token to use the controls", true); return; }
  if (d === "clear-logs") { $("loglist").innerHTML = ""; lastLogN = 0; post("api/clear-logs"); return; }
  if (d === "restart-all" && confirm("RESTART ALL bots?")) post("api/restart-all");
});
</script></body></html>
