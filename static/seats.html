<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>RADE OFFICE — seats</title>
<style>
  html,body{height:100%;margin:0;background:#07060c;color:#a99cc4;
    font:12px ui-monospace,Menlo,Consolas,monospace;overflow:hidden}
  #wrap{position:absolute;inset:0 0 0 240px;display:grid;place-items:center}
  canvas{image-rendering:pixelated;display:block;cursor:grab}
  canvas.drag{cursor:grabbing}
  #side{position:absolute;left:0;top:0;bottom:0;width:240px;background:#0d0a16;
    border-right:1px solid #2b2342;padding:12px;box-sizing:border-box;overflow:auto}
  h2{font-size:11px;letter-spacing:2px;color:#b57bff;margin:14px 0 6px;font-weight:400}
  h2:first-child{margin-top:0}
  .row{display:flex;align-items:center;gap:6px;margin:5px 0}
  .row label{flex:1;color:#8577a6}
  .row b{color:#e8def7;font-weight:400;min-width:34px;text-align:right}
  input[type=range]{width:100%}
  button{background:#1b1530;color:#cbbde6;border:1px solid #362b52;border-radius:4px;
    padding:6px 8px;font:inherit;cursor:pointer}
  button:hover{border-color:#6d54a8}
  button.on{background:#3b2a6b;color:#fff;border-color:#7d5fd0}
  .pick{display:flex;gap:4px;margin-bottom:8px}
  .pick button{flex:1}
  #msg{margin-top:10px;color:#7de0a0;min-height:16px}
  small{color:#6b5f85;display:block;line-height:1.5;margin-top:8px}
</style></head><body>
<div id="side">
  <h2>WHAT AM I MOVING</h2>
  <div class="pick">
    <button id="p-desk" class="on">desk</button>
    <button id="p-sofa">sofa</button>
  </div>
  <small>Drag anyone in the room to move that seat. Arrow keys nudge by one
  pixel. Every desk moves together — they share one offset.</small>

  <h2>SIZE</h2>
  <div class="row"><label>standing</label><b id="v-stand"></b></div>
  <input type="range" id="s-stand" min="90" max="200">
  <div class="row"><label>at a desk</label><b id="v-r1"></b></div>
  <input type="range" id="s-r1" min="60" max="150">
  <div class="row"><label>on the sofa</label><b id="v-r13"></b></div>
  <input type="range" id="s-r13" min="60" max="150">

  <h2>CHAIR</h2>
  <div class="row"><label>across</label><b id="v-cx"></b></div>
  <input type="range" id="s-cx" min="-120" max="40">
  <div class="row"><label>back</label><b id="v-cy"></b></div>
  <input type="range" id="s-cy" min="-140" max="20">

  <h2></h2>
  <button id="save" style="width:100%">SAVE &amp; REBAKE</button>
  <div id="msg"></div>
  <small>Saving rewrites seats.json and rebuilds scene.json, so
  <b>live.html</b> shows it on the next reload.</small>
</div>
<div id="wrap"><canvas id="cv"></canvas></div>
<script>
const cv = document.getElementById("cv"), cx = cv.getContext("2d");
const $ = id => document.getElementById(id);
const KEY = new URLSearchParams(location.search).get("k") || "";
const q = p => p + (KEY ? "?k=" + encodeURIComponent(KEY) : "");

const IMG = {}, load = (k, src) => new Promise(res => {
  const i = new Image(); i.onload = () => { IMG[k] = i; res(); }; i.onerror = () => res(); i.src = src;
});

let S = null, W = 0, H = 0, SCALE = 1, T = null, PICK = "desk";
const WHO = "rade";                       // one body is enough to judge a seat by
const ROW = {desk: "r1", sofa: "r13"};

async function boot(){
  S = await (await fetch("office/scene.json?v=" + Date.now())).json();
  T = await (await fetch(q("api/seats"))).json();
  [W, H] = S.world;
  const jobs = [load("bg", "office/room_bg.png")], seen = new Set();
  for (const p of S.props) if (!seen.has(p.a)) { seen.add(p.a); jobs.push(load("a:" + p.a, "office/assets/" + p.a + ".png")); }
  for (const r of ["r1", "r13"])
    for (const f of S.chars[WHO].rows[r].f)
      jobs.push(load("c:" + f.f, "office/chars/" + WHO + "/" + f.f + ".png"));
  await Promise.all(jobs);
  bindUI(); fit(); addEventListener("resize", fit); draw();
}

function fit(){
  SCALE = Math.min((innerWidth - 240) / W, innerHeight / H);
  const dpr = Math.min(2, devicePixelRatio || 1);
  cv.width = Math.round(W * SCALE * dpr); cv.height = Math.round(H * SCALE * dpr);
  cv.style.width = (W * SCALE) + "px"; cv.style.height = (H * SCALE) + "px";
  cx.setTransform(SCALE * dpr, 0, 0, SCALE * dpr, 0, 0);
  cx.imageSmoothingEnabled = false;
  draw();
}

/* the same arithmetic bake_scene does, so what is on screen is what gets baked */
function seats(){
  const out = [];
  for (const p of S.props) {
    if (p.a === "desk") {
      const c = [p.x + T.desk.chair[0], p.y + T.desk.chair[1]];
      out.push({kind: "desk", chair: c,
                x: c[0] + T.desk.sit[0], y: c[1] + T.desk.sit[1], sortY: c[1] + 1, z: 0});
    } else if (p.a === "sofa" && !out.some(s => s.kind === "sofa")) {
      out.push({kind: "sofa", chair: null, x: p.x + T.sofa.sit[0], y: p.y + T.sofa.sit[1],
                sortY: p.y + 2, z: p.z});
    }
  }
  return out;
}

/* row.k already carries the size the last bake used, so undo it and apply the
   slider instead — otherwise the preview lags one bake behind the numbers */
function drawn(kind){
  const row = S.chars[WHO].rows[ROW[kind]], f = row.f[0];
  const baked = T._baked && T._baked[ROW[kind]] || 1;
  const k = (T.stand / S.chars[WHO].base) * row.k * ((T.rowScale[ROW[kind]] || 1) / baked);
  return {im: IMG["c:" + f.f], f, k};
}

function draw(){
  if (!S || !IMG.bg) return;
  cx.clearRect(0, 0, W, H);
  cx.drawImage(IMG.bg, 0, 0);
  const list = S.props.map(p => ({y: p.y, z: p.z, run: () => {
    const im = IMG["a:" + p.a]; if (!im) return;
    cx.save();
    if (p.flip) { cx.translate(Math.round(p.x), 0); cx.scale(-1, 1); cx.translate(-Math.round(p.x), 0); }
    cx.drawImage(im, Math.round(p.x - im.width / 2), Math.round(p.y - im.height));
    cx.restore();
  }}));
  for (const s of seats()) {
    const b = drawn(s.kind);
    const w = Math.round(b.f.w * b.k), h = Math.round(b.f.h * b.k);
    const ox = Math.round((b.f.ax !== undefined ? b.f.ax : b.f.w / 2) * b.k);
    list.push({y: s.sortY, z: s.z, run: () => {
      if (b.im) cx.drawImage(b.im, Math.round(s.x) - ox, Math.round(s.y - h), w, h);
      if (s.kind === PICK) {
        cx.strokeStyle = "#b57bff"; cx.lineWidth = 1;
        cx.strokeRect(Math.round(s.x) - ox + .5, Math.round(s.y - h) + .5, w - 1, h - 1);
      }
    }});
  }
  list.sort((a, b) => (a.z - b.z) || (a.y - b.y)).forEach(o => o.run());
}

/* ------------------------------------------------------------------- input */
let drag = null;
cv.addEventListener("pointerdown", e => {
  const r = cv.getBoundingClientRect();
  const x = (e.clientX - r.left) / SCALE, y = (e.clientY - r.top) / SCALE;
  let best = null, bd = 1e9;
  for (const s of seats()) {
    const d = Math.hypot(s.x - x, s.y - 40 - y);
    if (d < bd) { bd = d; best = s; }
  }
  if (!best || bd > 90) return;
  PICK = best.kind; sync();
  drag = {kind: best.kind, x, y, at: T[best.kind].sit.slice()};
  cv.classList.add("drag"); cv.setPointerCapture(e.pointerId);
});
cv.addEventListener("pointermove", e => {
  if (!drag) return;
  const r = cv.getBoundingClientRect();
  const x = (e.clientX - r.left) / SCALE, y = (e.clientY - r.top) / SCALE;
  T[drag.kind].sit = [Math.round(drag.at[0] + x - drag.x), Math.round(drag.at[1] + y - drag.y)];
  draw();
});
addEventListener("pointerup", () => { drag = null; cv.classList.remove("drag"); });

addEventListener("keydown", e => {
  const d = {ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1]}[e.key];
  if (!d) return;
  e.preventDefault();
  T[PICK].sit = [T[PICK].sit[0] + d[0], T[PICK].sit[1] + d[1]];
  draw();
});

function slider(id, get, set, fmt){
  const s = $("s-" + id), v = $("v-" + id);
  s.value = get();
  v.textContent = fmt(get());
  s.oninput = () => { set(+s.value); v.textContent = fmt(+s.value); draw(); };
}

function bindUI(){
  T._baked = {};
  for (const r of ["r1", "r13"]) T._baked[r] = T.rowScale[r] || 1;
  slider("stand", () => T.stand, v => T.stand = v, v => v + "px");
  slider("r1", () => Math.round((T.rowScale.r1 || 1) * 100),
         v => T.rowScale.r1 = v / 100, v => v + "%");
  slider("r13", () => Math.round((T.rowScale.r13 || 1) * 100),
         v => T.rowScale.r13 = v / 100, v => v + "%");
  slider("cx", () => T.desk.chair[0], v => T.desk.chair[0] = v, v => v + "px");
  slider("cy", () => T.desk.chair[1], v => T.desk.chair[1] = v, v => v + "px");
  $("p-desk").onclick = () => { PICK = "desk"; sync(); };
  $("p-sofa").onclick = () => { PICK = "sofa"; sync(); };
  $("save").onclick = save;
}

function sync(){
  $("p-desk").classList.toggle("on", PICK === "desk");
  $("p-sofa").classList.toggle("on", PICK === "sofa");
  draw();
}

async function save(){
  const out = JSON.parse(JSON.stringify(T));
  delete out._baked;
  $("msg").textContent = "baking…";
  const r = await fetch(q("api/seats"), {method: "POST",
    headers: {"content-type": "application/json"},
    body: JSON.stringify({key: KEY, seats: out})});
  const j = await r.json();
  $("msg").textContent = j.ok ? "saved, scene rebaked" : ("failed: " + (j.msg || r.status));
  if (j.ok) { S = await (await fetch("office/scene.json?v=" + Date.now())).json(); bindUI(); draw(); }
}

boot();
</script></body></html>
