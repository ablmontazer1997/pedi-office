<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>RADE OFFICE — live room</title>
<style>
  html,body{height:100%;margin:0;background:#07060c;color:#8f82ab;
    font:12px ui-monospace,Menlo,Consolas,monospace;overflow:hidden}
  /* the room's own box: how tall it is, is worked out in fit() from the width,
     because the room has a fixed shape and the log strip below it is what gives
     way when the window does not */
  #wrap{position:absolute;inset:0;right:322px;bottom:182px;overflow:hidden;
    display:grid;place-items:center}
  canvas{image-rendering:pixelated;display:block}
  #hud{position:absolute;left:10px;top:10px;background:rgba(12,9,20,.8);
    border:1px solid #2f2646;border-radius:5px;padding:6px 9px;letter-spacing:1px}
  #hud b{color:#b57bff;font-weight:400}

  /* The console down the right, drawn from the pack art rather than from CSS
     shapes: the gems and the meter segments are the same pixel art the room is
     made of, so the panel belongs to the same picture. */
  @font-face{font-family:"BoldPixels";src:url("font/boldpixels.woff2") format("woff2"),
    url("font/boldpixels.woff") format("woff");font-display:swap}
  #side{position:absolute;top:12px;right:12px;bottom:12px;width:300px;
    overflow:auto;display:flex;flex-direction:column;gap:12px;
    font-family:"BoldPixels",ui-monospace,monospace}
  .box{background:#0c0a14;border:2px solid #7b3fd4;border-radius:10px;padding:11px 13px}
  .box > h3{margin:0 0 9px;padding:0 0 9px;font-size:15px;font-weight:400;
    letter-spacing:2px;color:#f0eafc;border-bottom:1px solid #35235c;
    display:flex;align-items:center;gap:9px;cursor:pointer;user-select:none}
  .box > h3 img{width:17px;height:17px;image-rendering:pixelated}
  .box > h3 .cv{margin-left:auto;font-size:11px;color:#6b5f85;transition:transform .12s}
  .box > h3.shut .cv{transform:rotate(-90deg)}
  .box > h3.shut + .body{display:none}

  .mrow{padding:10px 0;border-bottom:1px solid #241a3f}
  .mrow:last-child{border-bottom:0;padding-bottom:2px}
  .mrow .hd{display:flex;align-items:baseline;font-size:14px;letter-spacing:1.4px}
  .mrow .lb{flex:1;color:#e6dff5}
  .mrow .vl{color:#c07bff}
  .bar{display:flex;gap:2px;height:23px;margin-top:7px}
  .bar i{flex:1;background:url("ui/usage-empty.png") 0 0/100% 100% no-repeat;
    image-rendering:pixelated}
  .bar i.on{background-image:url("ui/usage-filled.png")}
  .bar.amber i{background-image:url("ui/usage-empty-amber.png")}
  .bar.amber i.on{background-image:url("ui/usage-filled-amber.png")}
  .bar.green i{background-image:url("ui/usage-empty-green.png")}
  .bar.green i.on{background-image:url("ui/usage-filled-green.png")}

  .brow{display:flex;align-items:center;gap:10px;padding:6px 2px;font-size:14px;
    letter-spacing:1px;color:#e6dff5;cursor:pointer;border-radius:6px}
  .brow:hover{background:#171128}
  .brow img{width:15px;height:15px;image-rendering:pixelated}
  .brow .nm{flex:1}
  .brow .ct{color:#f0eafc}

  #srv{display:flex;align-items:flex-end;gap:10px}
  #srv .rack{height:104px;image-rendering:pixelated;margin-left:22px}
  #srv .say{flex:1;text-align:right;font-size:13px;line-height:1.5;letter-spacing:1px;
    color:#cfc6e6;padding-bottom:4px}
  #srv .say b{display:block;font-weight:400}
  #srv .badge{width:26px;height:26px;image-rendering:pixelated;
    position:absolute;left:13px;bottom:11px}
  #srvBox{position:relative}

  /* the log strip along the bottom, the width of the room */
  #logs{position:absolute;left:12px;right:322px;bottom:12px;height:158px;
    background:#0c0a14;border:2px solid #7b3fd4;border-radius:10px;
    display:flex;flex-direction:column;font-family:"BoldPixels",ui-monospace,monospace}
  #logs .top{display:flex;align-items:center;padding:9px 12px;
    border-bottom:1px solid #35235c}
  #logs .top b{flex:1;font-weight:400;font-size:15px;letter-spacing:2px;color:#c07bff}
  #logs .top button{font:inherit;font-size:12px;letter-spacing:2px;color:#e6dff5;
    background:#1a1230;border:2px solid #7b3fd4;border-radius:6px;padding:3px 12px;
    cursor:pointer}
  #logs .top button:hover{background:#26183f}
  #llist{flex:1;overflow:auto;padding:7px 12px 9px;font-size:13px;line-height:1.65}
  #llist .ln{display:flex;align-items:center;gap:8px;white-space:nowrap}
  #llist .t{color:#6b5f85}
  #llist img{width:13px;height:13px;image-rendering:pixelated;flex:none}
  #llist .who{letter-spacing:1px}
  #llist .msg{overflow:hidden;text-overflow:ellipsis}
  #llist .none{color:#4e4568;letter-spacing:1px}
  /* the card that opens when you click somebody in the room */
  #card{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    width:min(620px,calc(100vw - 40px));max-height:calc(100vh - 40px);z-index:6;
    background:#0c0a14;border:2px solid #7b3fd4;border-radius:10px;display:none;
    flex-direction:column;font-family:"BoldPixels",ui-monospace,monospace;
    box-shadow:0 18px 60px #000c}
  #card.on{display:flex}
  #card .hd{display:flex;align-items:center;gap:10px;padding:11px 13px;
    border-bottom:1px solid #35235c}
  #card .hd img{width:18px;height:18px;image-rendering:pixelated}
  #card .hd b{font-weight:400;font-size:16px;letter-spacing:2px;color:#f0eafc}
  #card .hd .st{font-size:12px;letter-spacing:1.5px}
  #card .hd .x{margin-left:auto;cursor:pointer;color:#7d6ea0;font-size:15px;
    padding:0 4px;letter-spacing:0}
  #card .hd .x:hover{color:#f0eafc}
  #card .bd{padding:11px 13px;overflow:auto}
  #card .kv{display:flex;gap:10px;font-size:13px;letter-spacing:1px;padding:5px 0;
    border-bottom:1px solid #1c1533}
  #card .kv .k{width:126px;color:#8f82ab;flex:none}
  #card .kv .v{color:#e6dff5;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #card .grid{display:grid;grid-template-columns:1fr 1fr;gap:0 18px}
  #card .cap{font-size:12px;letter-spacing:2px;color:#c07bff;margin:12px 0 6px}
  /* the session itself, in the page's own colours rather than a terminal green */
  #term{background:#07050d;border:2px solid #35235c;border-radius:7px;padding:9px 11px;
    font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11.5px;line-height:1.5;
    color:#b9aede;white-space:pre;overflow:auto;max-height:230px;letter-spacing:0}
  #term .cur{color:#5ef08a}
  #term .dim{color:#5c5280}
  #ctl{display:flex;align-items:center;gap:9px;margin-top:12px}
  #ctl button{font:inherit;font-size:12px;letter-spacing:2px;color:#e6dff5;
    background:#1a1230;border:2px solid #7b3fd4;border-radius:6px;padding:6px 14px;
    cursor:pointer}
  #ctl button:hover{background:#26183f}
  #ctl button[disabled]{opacity:.35;cursor:not-allowed;border-color:#3a2b5e}
  #ctl #ctlMsg{font-size:12px;letter-spacing:1px;color:#8f82ab}

  /* nothing is drawn until every sprite is in, so the wait gets a bar */
  #boot{position:absolute;inset:0;z-index:9;background:#07060c;display:grid;
    place-items:center;font-family:"BoldPixels",ui-monospace,monospace;
    transition:opacity .35s}
  #boot.gone{opacity:0;pointer-events:none}
  #boot .in{width:min(420px,80vw);text-align:center}
  #boot h1{margin:0 0 4px;font-size:19px;font-weight:400;letter-spacing:5px;color:#c07bff}
  #boot p{margin:0 0 18px;font-size:11px;letter-spacing:2px;color:#5c5280}
  #boot .bar{display:flex;gap:2px;height:20px}
  #boot .bar i{flex:1;background:url("ui/usage-empty.png") 0 0/100% 100% no-repeat;
    image-rendering:pixelated}
  #boot .bar i.on{background-image:url("ui/usage-filled.png")}
  #boot .pc{margin-top:9px;font-size:12px;letter-spacing:2px;color:#8f82ab}

  @media (max-width:1150px){#side{display:none}#wrap{right:0}#logs{right:12px}}
</style></head><body>
<div id="wrap"><canvas id="cv"></canvas></div>
<div id="hud"><b id="act">…</b></div>

<div id="boot"><div class="in">
  <h1>RADE OFFICE</h1><p>LOADING THE ROOM</p>
  <div class="bar" id="bootBar"></div>
  <div class="pc" id="bootPc">0%</div>
</div></div>

<div id="card">
  <div class="hd"><img id="cGem" src="ui/bot-idle.png" alt=""><b id="cName">–</b>
    <span class="st" id="cState"></span><span class="x" id="cX">✕</span></div>
  <div class="bd">
    <div class="grid">
      <div class="kv priv"><span class="k">MODEL</span><span class="v" id="cModel">–</span></div>
      <div class="kv"><span class="k">CONTEXT</span><span class="v" id="cCtx">–</span></div>
      <div class="kv priv"><span class="k">OUTPUT TODAY</span><span class="v" id="cOut">–</span></div>
      <div class="kv priv"><span class="k">INPUT TODAY</span><span class="v" id="cIn">–</span></div>
      <div class="kv priv"><span class="k">CACHE READ</span><span class="v" id="cRead">–</span></div>
      <div class="kv priv"><span class="k">CACHE WRITE</span><span class="v" id="cWrite">–</span></div>
      <div class="kv priv"><span class="k">TURNS TODAY</span><span class="v" id="cTurns">–</span></div>
      <div class="kv"><span class="k">SERVICE</span><span class="v" id="cSvc">–</span></div>
    </div>
    <div class="cap" id="termCap">TERMINAL</div>
    <div id="term">–</div>
    <div id="ctl">
      <button data-a="restart">RESTART</button>
      <button data-a="stop">STOP</button>
      <button data-a="start">START</button>
      <span id="ctlMsg"></span>
    </div>
  </div>
</div>

<div id="logs">
  <div class="top"><b>LIVE LOGS</b><button id="logClear">CLEAR</button></div>
  <div id="llist"></div>
</div>

<div id="side">
  <div class="box">
    <h3><canvas id="iSys" width="9" height="9" style="width:17px;height:17px;image-rendering:pixelated"></canvas>SYSTEM STATUS<span class="cv">▾</span></h3>
    <div class="body">
      <div class="mrow"><div class="hd"><span class="lb">CPU USAGE</span><span class="vl" id="sCpu">–</span></div>
        <div class="bar" id="bCpu"></div></div>
      <div class="mrow"><div class="hd"><span class="lb">RAM USAGE</span><span class="vl" id="sRam">–</span></div>
        <div class="bar" id="bRam"></div></div>
      <div class="mrow"><div class="hd"><span class="lb">LOAD</span><span class="vl" id="sLoad">–</span></div>
        <div class="bar amber" id="bLoad"></div></div>
      <div class="mrow"><div class="hd"><span class="lb">DISK USED</span><span class="vl" id="sDisk">–</span></div>
        <div class="bar green" id="bDisk"></div></div>
      <div class="mrow"><div class="hd"><span class="lb">UPTIME</span>
        <span class="vl" id="sUp" style="color:#6fc6ff">–</span></div></div>
    </div>
  </div>

  <div class="box">
    <h3>BOTS SUMMARY<span class="cv">▾</span></h3>
    <div class="body" id="blist"></div>
  </div>

  <div class="box" id="srvBox">
    <h3>SERVER<span class="cv">▾</span></h3>
    <div class="body"><div id="srv">
      <img class="rack" src="ui/server.png" alt="">
      <img class="badge" id="srvBadge" src="ui/bot-running.png" alt="">
      <div class="say"><b id="srvA">All Systems</b><b id="srvB" style="color:#5ef08a">Operational</b></div>
    </div></div>
  </div>
</div>
<script>
const cv = document.getElementById("cv"), cx = cv.getContext("2d");

/* ?seed=N makes the wandering repeatable, which is the only way to screenshot
   the same run twice and get a real animation out of it */
const SEED = parseInt(new URLSearchParams(location.search).get("seed") || "0", 10);
let _s = SEED >>> 0;
const rnd = SEED ? () => ((_s = (_s * 1664525 + 1013904223) >>> 0) / 4294967296) : Math.random;
/* Every sprite in the room is loaded before the first frame is drawn, which is
   the better part of a thousand files: without a bar the page is a black
   rectangle for as long as that takes and reads as broken. */
let jobsDone = 0, jobsTotal = 0;
const BOOT_SEGS = 24;
function progress(){
  const bar = document.getElementById("bootBar");
  if (!bar.children.length)
    bar.innerHTML = Array.from({length: BOOT_SEGS}, () => "<i></i>").join("");
  const p = jobsTotal ? jobsDone / jobsTotal : 0;
  [...bar.children].forEach((s, i) => s.classList.toggle("on", i < Math.round(p * BOOT_SEGS)));
  document.getElementById("bootPc").textContent = Math.round(p * 100) + "%";
}
function tracked(p){
  jobsTotal++;
  return p.then(v => { jobsDone++; progress(); return v; },
                e => { jobsDone++; progress(); throw e; });
}

const IMG = {}, load = (k, src) => tracked(new Promise(res => {
  const i = new Image(); i.onload = () => { IMG[k] = i; res(); }; i.onerror = () => res(); i.src = src;
}));

let S = null, GRID = null, GW = 0, GH = 0, CELL = 10, W = 0, H = 0, SCALE = 1;

/* ---- how big a character is drawn: one factor per person, so their seated
   frame and their walking frame stay the same body. STAND is the height, in
   room pixels, of the walking sprite from sole to hair. ---- */
let STAND = 140;                            // overridden by the baked scene
const K = {};                               // tag -> scale, set once frames load

/* rows, as extract_rade.py wrote them */
const ROW = {S:"r0", SE:"r4", E:"r5", NE:"r6", N:"r7", W:"r8", NW:"r9", SW:"r10",
             type:"r1", typeBack:"r11", mug:"r2", sleep:"r3", react:"r12",
             sofa:"r13", drink:"r14"};

let CAST = [];

async function boot(){
  S = await (await fetch("office/scene.json", {cache:"no-store"})).json();
  [W, H] = S.world; CELL = S.cell;
  GRID = S.grid; GH = GRID.length; GW = GRID[0].length;
  CAST = Object.keys(S.chars);
  STAND = S.stand || STAND;
  const jobs = [load("bg", "office/room_bg.png")];
  // the plates wear the same gems as the summary, so the canvas needs them too,
  // and the same pixel face, which canvas will not use until it is really loaded
  for (const k in GEM) jobs.push(load("gem:" + k, GEM[k]));
  jobs.push(tracked(document.fonts.load('12px "BoldPixels"').catch(() => {})));
  const seen = new Set();
  for (const p of S.props) if (!seen.has(p.a)) { seen.add(p.a); jobs.push(load("a:" + p.a, "office/assets/" + p.a + ".png")); }
  for (const tag of CAST)
    for (const row in S.chars[tag].rows)
      for (const f of S.chars[tag].rows[row].f)
        jobs.push(load("c:" + tag + ":" + f.f, "office/chars/" + tag + "/" + f.f + ".png"));
  await Promise.all(jobs);
  // scale off the row's median frame, baked in as `base`: one frame of the walk
  // cycle is always a few pixels taller than the others, and picking it made
  // that character shorter than everyone else for the whole run
  for (const tag of CAST) K[tag] = STAND / S.chars[tag].base;
  await bots();
  setInterval(bots, 5000);
  fit(); addEventListener("resize", fit);
  const boot = document.getElementById("boot");
  boot.classList.add("gone");
  setTimeout(() => boot.style.display = "none", 400);
  requestAnimationFrame(frame);
}

const PANEL = 322, GAPB = 12, LOGMIN = 118, LOGMAX = 240;

function fit(){
  // The room is never cut: it is a picture of a whole office and half a desk
  // hanging off the edge is worse than a margin. So the height it needs is
  // worked out first, and the log strip below it takes whatever is left over —
  // that is what makes the room touch both edges at most window sizes without
  // anything being cropped. Only when the window is too short for even the
  // shortest log strip does the room stop filling the width.
  const wide = innerWidth > 1150;
  const availW = innerWidth - (wide ? PANEL : GAPB) - (wide ? 0 : GAPB);
  const need = availW * H / W;                       // room height at full width
  const logH = Math.round(Math.min(LOGMAX, Math.max(LOGMIN, innerHeight - need - GAPB)));
  const logs = document.getElementById("logs"), wrap = document.getElementById("wrap");
  logs.style.height = logH + "px";
  wrap.style.bottom = (logH + GAPB) + "px";
  const box = wrap.getBoundingClientRect();
  SCALE = Math.min(box.width / W, box.height / H);
  const dpr = Math.min(2, devicePixelRatio || 1);
  cv.width = Math.round(W * SCALE * dpr); cv.height = Math.round(H * SCALE * dpr);
  cv.style.width = (W * SCALE) + "px"; cv.style.height = (H * SCALE) + "px";
  cx.setTransform(SCALE * dpr, 0, 0, SCALE * dpr, 0, 0);
  cx.imageSmoothingEnabled = false;
}

/* ------------------------------------------------------------ the floor grid */
const free = (gx, gy) => gx >= 0 && gy >= 0 && gx < GW && gy < GH && GRID[gy][gx] === "0";
const cellOf = (x, y) => [Math.floor(x / CELL), Math.floor(y / CELL)];
const midOf = (gx, gy) => [gx * CELL + CELL / 2, gy * CELL + CELL / 2];

function nearestFree(x, y){
  let [gx, gy] = cellOf(x, y);
  if (free(gx, gy)) return [gx, gy];
  for (let r = 1; r < 40; r++)
    for (let dy = -r; dy <= r; dy++)
      for (let dx = -r; dx <= r; dx++)
        if (Math.abs(dx) === r || Math.abs(dy) === r) {
          if (free(gx + dx, gy + dy)) return [gx + dx, gy + dy];
        }
  return null;
}

/* A*, 8 way, never cutting the corner of a solid cell */
function path(from, to){
  const s = nearestFree(from[0], from[1]), g = nearestFree(to[0], to[1]);
  if (!s || !g) return null;
  const key = (a, b) => b * GW + a;
  const open = [[0, s]], came = new Map(), best = new Map([[key(s[0], s[1]), 0]]);
  const h = (a, b) => Math.hypot(a - g[0], b - g[1]);
  while (open.length) {
    open.sort((p, q) => p[0] - q[0]);
    const [, cur] = open.shift();
    if (cur[0] === g[0] && cur[1] === g[1]) {
      const out = []; let k = key(cur[0], cur[1]), c = cur;
      while (c) { out.push(midOf(c[0], c[1])); c = came.get(k); k = c ? key(c[0], c[1]) : null; }
      return out.reverse();
    }
    for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
      if (!dx && !dy) continue;
      const nx = cur[0] + dx, ny = cur[1] + dy;
      if (!free(nx, ny)) continue;
      if (dx && dy && (!free(cur[0] + dx, cur[1]) || !free(cur[0], cur[1] + dy))) continue;
      const nk = key(nx, ny), cost = (best.get(key(cur[0], cur[1])) || 0) + (dx && dy ? 1.41 : 1);
      if (best.has(nk) && best.get(nk) <= cost) continue;
      best.set(nk, cost); came.set(nk, cur);
      open.push([cost + h(nx, ny), [nx, ny]]);
    }
    if (best.size > 20000) break;
  }
  return null;
}

/* Is the straight line between two points clear? Sampled every few pixels, so a
   corner of a desk cannot slip between two samples. */
function clear(ax, ay, bx, by){
  const d = Math.hypot(bx - ax, by - ay), n = Math.ceil(d / 4);
  for (let i = 0; i <= n; i++) {
    const t = i / n;
    const [gx, gy] = cellOf(ax + (bx - ax) * t, ay + (by - ay) * t);
    if (!free(gx, gy)) return false;
  }
  return true;
}

/* String-pulling: the raw A* result is a staircase of 10 px cells, and walking
   it literally is what made them wobble — every step flipped the facing between
   two neighbouring directions. Keeping only the corners that are actually
   needed turns it into a few long straight legs. */
function smooth(p){
  if (!p || p.length < 3) return p;
  const out = [p[0]];
  let i = 0;
  while (i < p.length - 1) {
    let j = p.length - 1;
    while (j > i + 1 && !clear(p[i][0], p[i][1], p[j][0], p[j][1])) j--;
    out.push(p[j]);
    i = j;
  }
  return out;
}

/* ---------------------------------------------------------------- the cast */
const SPEED = 92;                                    // room px per second
/* One turn of the eight frame cycle is two steps. Driving the frame index off
   distance walked instead of off the clock is what stops the feet skating: the
   sprite only advances a frame once the body has actually moved a step. */
const STRIDE = 140;                                  // room px per full cycle
const FACE_HOLD = 180;                               // ms a new facing must be
                                                     // wanted before it sticks
const busy = {seats: {}, coffee: null, desks: {}};   // who is using what

function facing(dx, dy){
  // screen delta -> the eight isometric names; y counts double because the
  // floor is drawn flatter than it is deep
  const a = Math.atan2(dy * 2, dx) * 180 / Math.PI;
  if (a >= -22.5 && a < 22.5) return "E";
  if (a >= 22.5 && a < 67.5) return "SE";
  if (a >= 67.5 && a < 112.5) return "S";
  if (a >= 112.5 && a < 157.5) return "SW";
  if (a >= 157.5 || a < -157.5) return "W";
  if (a >= -157.5 && a < -112.5) return "NW";
  if (a >= -112.5 && a < -67.5) return "N";
  return "NE";
}

function face(A, d, now){
  if (d === A.dir) { A.wantDir = null; return; }
  if (A.wantDir !== d) { A.wantDir = d; A.wantAt = now; return; }
  if (now - A.wantAt >= FACE_HOLD) { A.dir = d; A.wantDir = null; }
}

function frameOf(A, row, i){
  const set = S.chars[A.tag].rows;
  const r = set[row] || set[ROW.S];
  const list = r.f;
  const f = list[((i % list.length) + list.length) % list.length];
  // the frame's own factor where the bake left one, which is every row whose
  // frames are all meant to be the same person at the same height
  return [IMG["c:" + A.tag + ":" + f.f], f, f.k !== undefined ? f.k : r.k, r];
}

function release(A){
  for (const k in busy.seats) if (busy.seats[k] === A) delete busy.seats[k];
  if (busy.coffee === A) busy.coffee = null;
  for (const k in busy.desks) if (busy.desks[k] === A) delete busy.desks[k];
}

// a free cushion, picked at random so the same end of the sofa is not always
// the one that fills up first
function freeSeat(){
  const open = (S.spots.seats || []).map((s, i) => i).filter(i => !busy.seats[i]);
  return open.length ? open[Math.floor(rnd() * open.length)] : -1;
}

function goto(A, spot, then, now){
  const pt = spot.walk || spot;
  const p = path([A.x, A.y], [pt.x, pt.y]);
  // no route: stand still for a moment and let the next plan pick something
  // else. Never re-plan from here, that recurses forever when the only target
  // allowed is the unreachable one.
  if (!p) { A.state = "react"; A.emote = 0; A.seat = null; release(A);
            A.until = now + 1500; return; }
  A.path = smooth(p); A.pi = 1; A.state = "walk"; A.then = then; A.spot = spot;
  A.prog = null;
}

const ONLY = new URLSearchParams(location.search).get("only");

/* What the room may do is decided by the bot each person stands for. A running
   turn puts them at their own desk and keeps them there; no session at all puts
   them asleep in that same chair; only an idle bot is free to roam. Everything
   here is measured in minutes rather than seconds, because an office where
   everyone changes seat every ten seconds does not read as an office. */
function mode(A){
  const b = WHOSE[A.tag], st = b ? b.state : "idle";
  return (st === "running" || st === "error") ? "work" : st === "off" ? "sleep" : "free";
}
// everybody has one desk, their own, and it is the only desk they ever use
function myDesk(A){
  const i = CAST.indexOf(A.tag);
  return S.spots.desks.length ? S.spots.desks[i % S.spots.desks.length] : null;
}

function plan(A, now){
  const m = A.mode = mode(A);
  const desk = myDesk(A);

  // Staying put is decided first, and only then is the seat given up. Clearing
  // it up here is what left somebody sitting in mid air: the pose said "at a
  // desk" while the seat that put him at one had already been thrown away.
  const settled = m === "work"  ? A.state === "type"
                : m === "sleep" ? A.state === "sleep"
                : A.state === "sofa" || A.state === "drink" || A.state === "sleep";
  if (settled && rnd() < 0.5) { A.until = now + 40000 + rnd() * 80000; return; }

  A.seat = null; release(A);
  // Only a bot that is really taking a turn sits at its keyboard. Anyone else is
  // off duty, and an office where an idle machine types away is exactly the lie
  // this room is here not to tell: they sleep in their own chair, take the sofa,
  // fetch a coffee or walk about.
  if (m === "work" && desk) return goto(A, desk, "work", now);
  if (m === "sleep" && desk) return goto(A, desk, "sleep", now);

  const r = ONLY === "sofa" ? 0 : ONLY === "coffee" ? .35 : ONLY === "desk" ? .6 : ONLY === "look" ? .9 : rnd();
  const seat = freeSeat();
  if (r < 0.30 && seat >= 0) {
    busy.seats[seat] = A; goto(A, S.spots.seats[seat], "sofa", now);
  } else if (r < 0.45 && S.spots.coffee && !busy.coffee) {
    busy.coffee = A; goto(A, S.spots.coffee, "coffee", now);
  } else if (r < 0.78 && desk) {
    goto(A, desk, "sleep", now);        // a nap in their own chair
  } else wander(A, now);
}

function wander(A, now){
  let gx, gy, n = 0;
  do { gx = Math.floor(rnd() * GW); gy = Math.floor(rnd() * GH); } while (!free(gx, gy) && ++n < 400);
  const [x, y] = midOf(gx, gy);
  goto(A, {x, y}, "look", now);
}

function arrive(A, now){
  const what = A.then;
  A.path = null;
  // sitting down moves him off the walkable cell and onto the furniture, with
  // the depth key that furniture needs
  A.seat = (A.spot && A.spot.sit && what !== "look") ? A.spot.sit : null;
  if (what === "work")        { A.state = "type";  A.until = now + 120000 + rnd() * 120000; A.act = "working"; }
  else if (what === "sleep")  { A.state = "sleep"; A.until = now + 180000 + rnd() * 180000; A.act = "asleep"; }
  else if (what === "sofa")   { A.state = "sofa";  A.until = now + 40000 + rnd() * 60000; A.act = "on the sofa"; }
  else if (what === "coffee") { A.state = "drink"; A.until = now + 25000 + rnd() * 35000; A.act = "coffee"; }
  else { A.state = "react"; A.until = now + 9000 + rnd() * 9000; A.emote = 1 + Math.floor(rnd() * 7); A.act = "…"; release(A); }
}

function step(A, dt, now){
  if (A.state === "walk") {
    A.act = "walking";
    let move = SPEED * dt;
    while (move > 0 && A.path && A.pi < A.path.length) {
      const [tx, ty] = A.path[A.pi];
      const dx = tx - A.x, dy = ty - A.y, d = Math.hypot(dx, dy);
      if (d <= move) { A.x = tx; A.y = ty; A.walked += d; move -= d; A.pi++; }
      else { A.x += dx / d * move; A.y += dy / d * move; A.walked += move;
             face(A, facing(dx, dy), now); move = 0; }
    }
    if (!A.path || A.pi >= A.path.length) arrive(A, now);
    // A walker is the one person in the room with no clock of its own: it walks
    // until it arrives. So a knot of people in a gangway used to hold until
    // somebody else's timer went off. If barely any ground has been covered in
    // the last few seconds, the errand is given up and a new one chosen, which
    // from the outside is him giving up and going somewhere else.
    else if (!A.prog || Math.hypot(A.x - A.prog.x, A.y - A.prog.y) > 12)
      A.prog = {x: A.x, y: A.y, at: now};
    else if (now - A.prog.at > 3000) { A.prog = null; plan(A, now); return; }
    A.row = ROW[A.dir]; A.t += dt;
    // A row does not always hold eight frames — the bake drops the ones drawn as
    // a different build — so a full stride is however many it has, or the feet
    // would run at double speed on a four frame row.
    const row = S.chars[A.tag].rows[A.row];
    const n = row ? row.f.length : 8;
    A.fi = Math.floor(A.walked / (STRIDE / n));
    return;
  }
  A.t += dt;
  const has = r => !!S.chars[A.tag].rows[r];
  if (A.state === "sofa")  { A.row = has(ROW.sofa) ? ROW.sofa : ROW.mug;  A.fi = Math.floor(A.t * 3); }
  if (A.state === "drink") { A.row = has(ROW.drink) ? ROW.drink : ROW.mug; A.fi = Math.floor(A.t * 4); }
  if (A.state === "type")  { A.row = ROW.type;  A.fi = Math.floor(A.t * 5); }
  // Only two sheets were drawn asleep. For everyone else it used to be the
  // typing pose held still, which read as somebody working with zZ stuck over
  // their head; the sitting-back pose reads as somebody who has stopped.
  if (A.state === "sleep") { const s = has(ROW.sleep);
                             A.row = s ? ROW.sleep : has(ROW.sofa) ? ROW.sofa : ROW.type;
                             A.fi = s ? Math.floor(A.t * 2) : 0; }
  if (A.state === "react") { A.row = ROW.react; A.fi = A.emote; }
  if (now > A.until) { A.t = 0; plan(A, now); }
}

/* Nobody walks through anybody either. Two people who end up standing in the
   same place lean away from each other, onto floor they could have walked to
   anyway. The gap is measured on the floor rather than on the screen: a step
   sideways covers two and a half times the ground a step up or down does, so a
   plain distance in pixels would have them elbowing each other from across the
   room.

   Leaning away is a speed, and a slower one than walking. Setting the gap
   outright instead - which is what this did at first - makes it a wall: a man
   walking at somebody standing in a gangway is shoved back exactly as far as he
   steps forward, every frame, for as long as the other one stays put, and the
   two of them stand there for good. At two thirds of a walking pace he loses
   ground while they are shoulder to shoulder and gains it again once he is
   past, which is what squeezing by looks like. */
const NEAR = 30, SQUASH = 2.5, LEAN = 60;

function nudge(A, dx, dy){
  const x = A.x + dx, y = A.y + dy;
  if (free(Math.floor(x / CELL), Math.floor(y / CELL))) { A.x = x; A.y = y; }
}

function jostle(crew, dt){
  for (let i = 0; i < crew.length; i++)
    for (let j = i + 1; j < crew.length; j++) {
      const a = crew[i], b = crew[j];
      if (a.seat || b.seat) continue;
      const dx = b.x - a.x, dy = (b.y - a.y) * SQUASH, d = Math.hypot(dx, dy);
      if (d >= NEAR || d < 0.01) continue;
      const p = Math.min((NEAR - d) / 2, LEAN * dt) / d;
      nudge(a, -dx * p, -dy * p / SQUASH);
      nudge(b, dx * p, dy * p / SQUASH);
    }
}

/* -------------------------------------------------------------- name plates */
/* Everyone in the room stands for one of the bots on this box, so each of them
   carries that bot's state over their head. The list comes from the same
   /api/status the dashboard reads, so a plate can never claim a bot is running
   when the dashboard says it is off. */
let BOTS = [], WHOSE = {};

// the plate says the same words the summary says, in the same colours, with the
// same gem: one vocabulary for the whole page
const STATE = {
  running:  {en: "Running",  c: "#5ef08a"},
  idle:     {en: "Idle",     c: "#ffb020"},
  off:      {en: "Offline",  c: "#8f82ab"},
  error:    {en: "Error",    c: "#ff5f6b"},
  updating: {en: "Updating", c: "#7cc4ff"},
};

let MACHINE = {}, UPLINK = {}, LOGS = [];
// the logs are the one part of the status the server keeps behind the token, so
// the page passes on whatever key it was opened with
const KEY = new URLSearchParams(location.search).get("k") || "";

async function bots(){
  try {
    const d = await (await fetch("api/status" + (KEY ? "?k=" + encodeURIComponent(KEY) : ""),
                                 {cache: "no-store"})).json();
    BOTS = d.bots || [];
    MACHINE = d.machine || {}; UPLINK = d.api || {};
    LOGS = d.logs || [];
    logStrip();
    // one bot per character, in a fixed order, so nobody swaps identity between
    // polls; any character left over is simply somebody who works here
    WHOSE = {};
    CAST.forEach((tag, i) => { if (BOTS[i]) WHOSE[tag] = BOTS[i]; });
    // a bot that just started a turn does not wait out its coffee break
    if (CREW) for (const A of CREW)
      if (A.mode !== undefined && mode(A) !== A.mode) plan(A, performance.now());
    board();
    if (OPEN) card();               // the open card follows the same five second poll
  } catch (e) { /* the room keeps running without the dashboard */ }
}

/* ---------------------------------------------------------------- the logs */
// what a log level looks like: the same five gems the summary uses
const LEVEL = {ok:   {gem: "running",  c: "#5ef08a"},
               err:  {gem: "error",    c: "#ff5f6b"},
               warn: {gem: "idle",     c: "#ffb020"},
               info: {gem: "updating", c: "#7cc4ff"}};
let logFloor = 0;                      // CLEAR hides everything up to here

function logStrip(){
  const el = document.getElementById("llist"); if (!el) return;
  const rows = LOGS.filter(l => l.n > logFloor).slice(-60).reverse();
  if (!rows.length){
    el.innerHTML = '<div class="none">' +
      (KEY ? "— nothing yet —" : "— open with the token to read the logs —") + "</div>";
    return;
  }
  el.innerHTML = rows.map(l => {
    const lv = LEVEL[l.level] || LEVEL.info;
    return '<div class="ln"><span class="t">[' + esc(l.t) + ']</span>' +
      '<img src="' + GEM[lv.gem] + '" alt="">' +
      '<span class="who" style="color:' + lv.c + '">' + esc(l.who).toUpperCase() + ':</span>' +
      '<span class="msg" style="color:' + lv.c + '">' + esc(l.msg) + '</span></div>';
  }).join("");
}
function esc(s){ return String(s == null ? "" : s)
  .replace(/[&<>]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;"}[c])); }
document.getElementById("logClear").onclick = () => {
  logFloor = LOGS.length ? LOGS[LOGS.length - 1].n : logFloor;
  logStrip();
};

/* ------------------------------------------------------------- the console */
const SEGS = 16;                       // segments in a meter, as the design has it

function meter(id, pct){
  const el = document.getElementById(id); if (!el) return;
  if (!el.children.length)
    el.innerHTML = Array.from({length: SEGS}, () => "<i></i>").join("");
  // round up, so any load at all lights the first segment: a meter that reads
  // empty while something is running is worse than one segment of a lie
  const on = pct == null ? 0 : Math.min(SEGS, Math.ceil(pct / 100 * SEGS));
  [...el.children].forEach((s, i) => s.classList.toggle("on", i < on));
}
// the little bar-chart on the SYSTEM STATUS heading
function sysGlyph(){
  const c = document.getElementById("iSys"); if (!c) return;
  const g = c.getContext("2d");
  g.clearRect(0, 0, 9, 9); g.fillStyle = "#c07bff";
  g.fillRect(0, 5, 2, 4); g.fillRect(3, 2, 2, 7); g.fillRect(6, 0, 2, 9);
}

// what the room calls a state -> what the summary calls it. `updating` is a bot
// the server was told to restart and that has not come back yet.
const SUMMARY = [
  ["running",  "Running"],
  ["idle",     "Idle"],
  ["error",    "Error"],
  ["updating", "Updating"],
  ["off",      "Offline"],
];
const GEM = {running:"ui/bot-running.png", idle:"ui/bot-idle.png", error:"ui/bot-error.png",
             updating:"ui/bot-updating.png", off:"ui/bot-offline.png"};

let glyphDrawn = false;
function board(){
  const m = MACHINE;
  const set = (id, v) => { const e = document.getElementById(id); if (e) e.textContent = v; };
  if (!glyphDrawn) { glyphDrawn = true; sysGlyph(); }

  set("sCpu", m.cpu == null ? "–" : m.cpu + "%");   meter("bCpu", m.cpu);
  set("sRam", m.ram == null ? "–" : m.ram + "%");   meter("bRam", m.ram);
  // load against the core count is the honest version of a queue: how much work
  // this box has been asked for against how much of it there is
  const cores = m.cores || 1;
  set("sLoad", m.load == null ? "–" : m.load + " / " + cores);
  meter("bLoad", m.load == null ? null : m.load / cores * 100);
  set("sDisk", m.disk == null ? "–" : m.disk + "%"); meter("bDisk", m.disk);
  set("sUp", m.uptime || "–");

  const count = {};
  BOTS.forEach(b => { const k = b.updating ? "updating" : b.state;
                      count[k] = (count[k] || 0) + 1; });
  const list = document.getElementById("blist");
  list.innerHTML = SUMMARY.map(([k, label]) =>
    '<div class="brow" data-k="' + k + '"><img src="' + GEM[k] + '" alt="">' +
    '<span class="nm">' + label + '</span>' +
    '<span class="ct">' + (count[k] || 0) + '</span></div>').join("");
  // clicking a line names the bots that are in that state
  [...list.children].forEach(el => el.onclick = () => {
    const k = el.dataset.k;
    const who = BOTS.filter(b => (b.updating ? "updating" : b.state) === k).map(b => b.name);
    document.getElementById("act").textContent = who.length ? who.join("   ") : "—";
  });

  // one line for the whole box: the uplink first, then anything a bot is shouting
  const bad = BOTS.filter(b => b.state === "error").length;
  let a = "All Systems", b = "Operational", col = "#5ef08a", gem = "running";
  if (UPLINK.ok === false)      { a = "API Uplink"; b = "Unreachable"; col = "#ff5f6b"; gem = "error"; }
  else if (UPLINK.ok == null)   { a = "Uplink";     b = "Probing…";    col = "#8f82ab"; gem = "offline"; }
  else if (bad)                 { a = bad + (bad > 1 ? " Bots" : " Bot"); b = "In Error";
                                  col = "#ffb020"; gem = "idle"; }
  set("srvA", a); set("srvB", b);
  document.getElementById("srvB").style.color = col;
  document.getElementById("srvBadge").src = GEM[gem];
}
[...document.querySelectorAll("#side h3")].forEach(h =>
  h.onclick = () => h.classList.toggle("shut"));

/* The plates read in English now, so they can wear the same pixel face the
   panel does. FACE stays for the zZ, which is drawn as a letter. */
const FACE = '"BoldPixels",Tahoma,"Segoe UI",Arial,sans-serif';

function plate(g, A, px, top){
  const b = WHOSE[A.tag];
  if (!b) return;
  const key = b.updating ? "updating" : (STATE[b.state] ? b.state : "idle");
  const st = STATE[key];
  const gem = IMG["gem:" + key];
  const ICO = 14, GAP = 6, PAD = 9;

  g.font = "12px " + FACE;
  const nw = g.measureText(b.name).width;
  g.font = "11px " + FACE;
  const sw = g.measureText(st.en).width;
  const w = Math.round(PAD * 2 + ICO + GAP + Math.max(nw, sw)), h = 40, tail = 6;
  const x = Math.round(px - w / 2), y = Math.round(top - h - tail - 5);
  HITS.push({tag: A.tag, x0: x, y0: y, x1: x + w, y1: y + h});

  g.fillStyle = "#07050d";
  g.fillRect(x, y, w, h);
  g.fillStyle = "#b57bff";                       // a drawn border, not a stroke:
  g.fillRect(x, y, w, 2); g.fillRect(x, y + h - 2, w, 2);        // a stroke lands
  g.fillRect(x, y, 2, h); g.fillRect(x + w - 2, y, 2, h);        // on half pixels
  // the tail, a pixel step per row, with the box's bottom edge opened under it
  g.fillStyle = "#07050d"; g.fillRect(px - 4, y + h - 2, 9, 2);
  for (let i = 0; i < tail; i++) {
    const half = 5 - Math.round(i * 5 / tail);
    g.fillStyle = "#07050d"; g.fillRect(px - half, y + h + i, half * 2 + 1, 1);
    g.fillStyle = "#b57bff";
    g.fillRect(px - half - 2, y + h + i, 2, 1); g.fillRect(px + half + 1, y + h + i, 2, 1);
  }
  g.fillRect(px - 1, y + h + tail, 3, 1);        // close the tip

  // gem, then the name, then the state underneath it: the state belongs to the
  // name, so it is indented to it rather than centred in the box
  const tx = x + PAD + ICO + GAP;
  if (gem) g.drawImage(gem, x + PAD, y + 13 - ICO / 2, ICO, ICO);
  g.textAlign = "left"; g.textBaseline = "middle";
  g.font = "12px " + FACE; g.fillStyle = "#ece5f7";
  g.fillText(b.name, tx, y + 13);
  g.font = "11px " + FACE; g.fillStyle = st.c;
  g.fillText(st.en, tx, y + 28);
  g.textBaseline = "alphabetic";
}

/* --------------------------------------------------- click somebody to look */
/* Everyone in the room is a bot, so the room itself is the index: clicking a
   character opens what the dashboard knows about it, down to the tail of the
   session it is running right now. */
let HITS = [], OPEN = null;

function num(n){
  if (n == null) return "–";
  if (n >= 1e6) return (n / 1e6).toFixed(n >= 1e7 ? 0 : 1) + "M";
  if (n >= 1e3) return (n / 1e3).toFixed(n >= 1e4 ? 0 : 1) + "k";
  return String(n);
}

function card(){
  const el = document.getElementById("card");
  const b = OPEN && WHOSE[OPEN];
  if (!b) { el.classList.remove("on"); return; }
  const key = b.updating ? "updating" : (STATE[b.state] ? b.state : "idle");
  const set = (id, v) => document.getElementById(id).textContent = v;
  document.getElementById("cGem").src = GEM[key];
  set("cName", b.name + (b.fa ? "  ·  " + b.fa : ""));
  const st = document.getElementById("cState");
  st.textContent = STATE[key].en.toUpperCase(); st.style.color = STATE[key].c;

  const t = b.tokens || {};
  set("cModel", b.model || (KEY ? "–" : "token required"));
  set("cCtx", b.ctxk != null ? b.ctxk + "k / " + b.ctxmax + "k  (" + b.ctx + "%)"
              : b.ctx != null ? b.ctx + "%" : "–");
  set("cOut", num(t.out)); set("cIn", num(t.in));
  set("cRead", num(t.read)); set("cWrite", num(t.write));
  set("cTurns", t.turns == null ? "–" : String(t.turns));
  set("cSvc", b.managed ? "systemd · always on" : "manual");

  // Read-only visitors see the room and what the bots are doing, never what they
  // are saying: without the token there is no terminal and no buttons at all,
  // rather than a box explaining what they are missing.
  const term = document.getElementById("term");
  // the model and the token counts are stripped from a public status, so their
  // rows are not shown at all rather than shown holding a dash
  for (const row of document.querySelectorAll("#card .priv"))
    row.style.display = KEY ? "" : "none";
  document.getElementById("termCap").style.display = KEY ? "" : "none";
  term.style.display = KEY ? "" : "none";
  document.getElementById("ctl").style.display = KEY ? "flex" : "none";
  const pane = b.pane || [];
  if (!KEY) { ctlSet(b); el.classList.add("on"); return; }
  ctlSet(b);
  if (!pane.length) {
    term.textContent = b.state === "off" ? "session is not running"
                                         : "nothing on the pane";
  } else {
    term.innerHTML = pane.map(l => {
      const cls = /^\s*[✻✽✶✳✢✴✱*]\s/.test(l) ? "cur" : /^\s*[·>⏵╭╰│]/.test(l) ? "dim" : "";
      return cls ? '<span class="' + cls + '">' + esc(l) + "</span>" : esc(l);
    }).join("\n");
    term.scrollTop = term.scrollHeight;
  }
  el.classList.add("on");
}

/* Managing the bot from the same card: the three things the dashboard can
   really do. Stopping a systemd bot is not one of them — the unit would put it
   straight back — so that button says so instead of failing silently. */
let msgUntil = 0;                            // an answer holds the line for a bit

function ctlSet(b){
  const msg = document.getElementById("ctlMsg");
  if (performance.now() > msgUntil)
    msg.textContent = b.managed ? "systemd · stop needs root" : "";
  for (const btn of document.querySelectorAll("#ctl button"))
    btn.disabled = btn.dataset.a === "stop" && b.managed;
}

async function act(action){
  const b = OPEN && WHOSE[OPEN];
  if (!b) return;
  const msg = document.getElementById("ctlMsg");
  msg.textContent = action + "…"; msgUntil = performance.now() + 8000;
  try {
    const r = await fetch("api/action", {method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({key: KEY, id: b.id, action})});
    const j = await r.json();
    msg.textContent = j.msg || (j.ok ? "ok" : "failed");
  } catch (e) { msg.textContent = "no answer from the server"; }
  msgUntil = performance.now() + 8000;
  bots();                                   // pull the new state straight away
}
for (const btn of document.querySelectorAll("#ctl button"))
  btn.onclick = () => act(btn.dataset.a);

function pick(ev){
  const r = cv.getBoundingClientRect();
  const x = (ev.clientX - r.left) / SCALE, y = (ev.clientY - r.top) / SCALE;
  let hit = null;
  for (const h of HITS)
    if (x >= h.x0 && x <= h.x1 && y >= h.y0 && y <= h.y1 && (!hit || h.y1 > hit.y1)) hit = h;
  return hit;
}
cv.addEventListener("click", ev => {
  const h = pick(ev);
  if (!h) return;
  OPEN = OPEN === h.tag ? null : h.tag;
  card();
});
cv.addEventListener("mousemove", ev => { cv.style.cursor = pick(ev) ? "pointer" : "default"; });
document.getElementById("cX").onclick = () => { OPEN = null; card(); };
addEventListener("keydown", e => { if (e.key === "Escape" && OPEN) { OPEN = null; card(); } });

/* Two z's drifting off the head of whoever is asleep, so a still sprite reads as
   sleeping and not as a character that froze. */
function zzz(g, px, top, t){
  g.textAlign = "left"; g.textBaseline = "alphabetic";
  // beside the head, not above it: over the head is where the name plate is
  for (let i = 0; i < 2; i++) {
    const p = ((t * 0.4 + i * 0.5) % 1);
    g.globalAlpha = 0.95 * (1 - p * 0.8);
    g.fillStyle = "#d9c6ff";
    g.font = "bold " + (12 + i * 5) + "px " + FACE;
    g.fillText("z", px + 24 + i * 8 + Math.sin((t + i) * 2) * 2, top + 18 - p * 22);
  }
  g.globalAlpha = 1;
}

/* --------------------------------------------------------------- depth sort

   Sorting the room by one y per sprite is only right for a dot on the floor. A
   desk covers a stretch of floor, so somebody walking past its left side and
   somebody standing behind it can share a y and still belong on opposite sides
   of it. Every piece therefore carries the patch of floor it stands on, as a
   box along the floor's own two axes, and the room is ordered by asking of each
   pair which one is nearer: nearer along either axis, with no overlap on that
   axis, settles it. Only two things sharing the same floor - a rug under a
   table, a lamp over the boards it lights, a typist at his own desk - fall
   through to the layer number. */
const TILE = () => S.tile || [45, 18];

function spotOf(x, y, r){
  const [tw, th] = TILE();
  const u = (x / tw + y / th) / 2, v = (y / th - x / tw) / 2;
  r = r === undefined ? 0.28 : r;
  return [u - r, u + r, v - r, v + r];
}

/* do the two sprites share any pixels at all? Two pieces that never touch on
   screen cannot hide each other, and asking which is in front of the other
   invents an order between them that has no meaning - the coffee table came out
   under its own rug because a chair on the far side of the room was "nearer"
   along one axis and dragged the two of them into a loop. */
function meets(a, b){
  return a.r[0] < b.r[2] && b.r[0] < a.r[2] && a.r[1] < b.r[3] && b.r[1] < a.r[3];
}

/* does `a` have to be painted before `b`? */
function under(a, b){
  const p = a.fp, q = b.fp;
  if (p && q) {
    if (p[0] >= q[1]) return false;         // a is further down one axis: nearer
    if (q[0] >= p[1]) return true;
    if (p[2] >= q[3]) return false;         // ...or down the other
    if (q[2] >= p[3]) return true;
  }
  return (a.z - b.z || a.y - b.y) < 0;      // same floor: the layer decides
}

function depthSort(list){
  const out = [], seen = new Array(list.length).fill(0);
  // depth first, so a thing goes down only after everything it stands behind.
  // `seen` is set on the way in as well as on the way out, which is what keeps
  // a ring of three pieces that each overlap the next from looping forever.
  const visit = i => {
    if (seen[i]) return;
    seen[i] = 1;
    for (let j = 0; j < list.length; j++)
      if (j !== i && !seen[j] && meets(list[j], list[i]) && under(list[j], list[i]))
        visit(j);
    out.push(list[i]);
  };
  // start from the back so the common case comes out in one pass
  const order = list.map((o, i) => i)
                    .sort((i, j) => (list[i].z - list[j].z) || (list[i].y - list[j].y));
  for (const i of order) visit(i);
  return out;
}

/* ------------------------------------------------------------------ drawing */
let CREW = null;

function spawn(){
  CREW = CAST.map((tag, i) => {
    // start everyone on real floor, spread across the room so they do not all
    // set off from the same tile
    let c = null, n = 0;
    while (!c && n++ < 500) {
      const gx = Math.floor(rnd() * GW), gy = Math.floor(rnd() * GH);
      if (free(gx, gy)) c = midOf(gx, gy);
    }
    c = c || [W / 2, H * 0.72];
    return {tag, x: c[0], y: c[1], dir: "S", row: ROW.S, fi: 0, t: 0,
            state: "idle", until: 0, path: null, pi: 0, seat: null, walked: 0, act: "…"};
  });
}

function frame(now){
  requestAnimationFrame(frame);
  if (!S || !IMG.bg) return;
  now /= 1000;
  if (!CREW) { spawn(); CREW.forEach((A, i) => plan(A, now * 1000 + i * 400)); }
  if (!frame.last) frame.last = now;
  const dt = Math.min(0.05, now - frame.last); frame.last = now;
  for (const A of CREW) step(A, dt, now * 1000);
  jostle(CREW, dt);

  cx.clearRect(0, 0, W, H);
  cx.drawImage(IMG.bg, 0, 0);

  // A couple of the drawn poses sit on a chair of their own. Where one of those
  // is at a desk, that desk's chair is left out of the picture for as long as
  // they are in it, or the room shows the same seat twice.
  const spare = new Set();
  for (const A of CREW) {
    const r = S.chars[A.tag].rows[A.row];
    if (A.seat && r && r.chair && A.spot && A.spot.chairIdx >= 0) spare.add(A.spot.chairIdx);
  }

  const list = S.props.map((p, pi) => {
    const im = IMG["a:" + p.a], iw = im ? im.width : 0, ih = im ? im.height : 0;
    return {fp: p.fp, y: p.y, z: p.z,
            r: [p.x - iw / 2, p.y - ih, p.x + iw / 2, p.y], run: () => {
    if (spare.has(pi)) return;
    if (!im) return;
    cx.save();
    if (p.flip) { cx.translate(Math.round(p.x), 0); cx.scale(-1, 1); cx.translate(-Math.round(p.x), 0); }
    cx.drawImage(im, Math.round(p.x - im.width / 2), Math.round(p.y - im.height));
    cx.restore();
  }};
  });

  const plates = [];
  HITS = [];
  for (const A of CREW) {
    const [sp, meta, rk, rowMeta] = frameOf(A, A.row, A.fi);
    const k = K[A.tag] * rk;
    // xk is the bake's width correction, one per row: the same build whichever
    // way this person happens to be facing
    const kx = k * ((rowMeta && rowMeta.xk) || 1);
    const cw = Math.round(meta.w * kx), ch = Math.round(meta.h * k);
    const px = A.seat ? A.seat.x : A.x, py = A.seat ? A.seat.y : A.y;
    plates.push({A, px: Math.round(px), top: Math.round(py - ch)});
    // hang the frame from the middle of the torso, not the middle of the frame
    const ox = Math.round((meta.ax !== undefined ? meta.ax : meta.w / 2) * kx);
    if (WHOSE[A.tag])
      HITS.push({tag: A.tag, x0: px - ox, y0: py - ch, x1: px - ox + cw, y1: py});
    list.push({fp: A.seat ? (A.seat.fp || spotOf(px, py)) : spotOf(px, py),
               y: A.seat ? A.seat.sortY : A.y,
               z: A.seat ? (A.seat.dz || 0) : 0,
               r: [px - ox, py - ch, px - ox + cw, py], run: () => {
      if (!sp) return;
      if (!A.seat) {
        cx.globalAlpha = .22; cx.fillStyle = "#000";
        cx.beginPath(); cx.ellipse(px, py, cw * 0.32, cw * 0.14, 0, 0, 6.284); cx.fill();
        cx.globalAlpha = 1;
      }
      // a seat may want the sitter the other way round: the armchair faces
      // south west and the pose was only drawn facing south east
      if (A.seat && A.seat.flip) {
        cx.save();
        cx.translate(Math.round(px), 0); cx.scale(-1, 1);
        cx.drawImage(sp, -(cw - ox), Math.round(py - ch), cw, ch);
        cx.restore();
      } else cx.drawImage(sp, Math.round(px) - ox, Math.round(py - ch), cw, ch);
    }});
  }

  depthSort(list).forEach(o => o.run());
  // after everything else: a name plate belongs to the viewer, not to the room,
  // so a desk in front of somebody must not eat half of it
  for (const p of plates) plate(cx, p.A, p.px, p.top);
  for (const p of plates) if (p.A.state === "sleep") zzz(cx, p.px, p.top, now);

  if (!frame.hudAt || now - frame.hudAt > 0.5) {
    frame.hudAt = now;
    document.getElementById("act").textContent =
      CREW.map(A => A.tag + ": " + A.act).join("   ");
  }
}


boot();
</script></body></html>
